# ===================================================
# GitHub Actions Workflow - Build và Release
# Quản Lý Kho - An Tín Solution
# ===================================================

name: Build and Release - Quản Lý Kho

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Số phiên bản (VD: 1.0.0)'
        required: true
        default: '1.0.0'
      release_name:
        description: 'Tên Release'
        required: true
        default: 'Release v1.0.0 - An Tín Solution'
      is_prerelease:
        description: 'Đánh dấu là bản thử nghiệm (Prerelease)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: 'x64'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install pywin32
        if (Test-Path requirements.txt) {
            pip install -r requirements.txt
        }
        echo "Dependencies installed successfully"

    - name: Build application with PyInstaller
      run: |
        pyinstaller QL_KHO.spec --clean --noconfirm
        if (Test-Path "dist\QL_KHO\QL_KHO.exe") {
            echo "Build successful!"
        } else {
            echo "Build failed!"
            exit 1
        }

    - name: Get version
      id: get_version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } elseif ("${{ github.ref_type }}" -eq "tag") {
          $version = "${{ github.ref_name }}".Substring(1)
        } else {
          $version = "1.0.0"
        }
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuanLyKho_Application
        path: dist/QL_KHO
        retention-days: 30
        if-no-files-found: error

    - name: Create Release from tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        name: "Release ${{ env.VERSION }} - An Tín Solution"
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/QL_KHO/QL_KHO.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release from Manual Trigger
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ github.event.inputs.release_name }}
        tag_name: v${{ env.VERSION }}
        draft: false
        prerelease: ${{ github.event.inputs.is_prerelease }}
        generate_release_notes: true
        files: |
          dist/QL_KHO/QL_KHO.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build success notification
      if: success()
      run: |
        echo "========================================"
        echo "✅ BUILD SUCCESSFUL - Quản Lý Kho"
        echo "📦 Version: ${{ env.VERSION }}"
        echo "🏢 Developer: An Tín Solution"
        echo "📱 Contact: Zalo 0344 53 68 62"
        echo "========================================"

    - name: Build failure notification
      if: failure()
      run: |
        echo "========================================"
        echo "❌ BUILD FAILED - Quản Lý Kho"
        echo "🛠️ Check logs for details"
        echo "📱 Contact: Zalo 0344 53 68 62"
        echo "========================================"
        exit 1
