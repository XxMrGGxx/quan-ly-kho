<div class="report-section" id="rpt-sales">
    <div id="sales-loading" class="text-center" style="padding:20px;color:#94a3b8"><i>Đang tải báo cáo doanh thu...</i></div>
    <div id="sales-error" class="text-center" style="display:none"></div>
    <div id="sales-content" style="display:none">
        <table class="report-table">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã đơn</th>
                    <th>Ngày</th>
                    <th>Nhân viên</th>
                    <th>Khách hàng</th>
                    <th>SL SP</th>
                    <th>Doanh thu</th>
                    <th>Giảm giá</th>
                    <th>Thanh toán</th>
                </tr>
            </thead>
            <tbody id="sales-body"></tbody>
            <tfoot>
                <tr>
                    <td colspan="8" style="text-align:right;font-weight:bold;">Tổng cộng:</td>
                    <td id="sales-total" style="font-weight:bold;">0 đ</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
<script>
(function(){
    var f = window.reportFilters || {};
    var params = 'start_date='+f.start_date+'&end_date='+f.end_date+(f.warehouse_id?'&warehouse_id='+f.warehouse_id:'')+(f.created_by?'&created_by='+f.created_by:'');
    window.WMS.api('/reports/sales?'+params).then(function(sales){
        document.getElementById('sales-loading').style.display='none';
        document.getElementById('sales-content').style.display='';
        var body=document.getElementById('sales-body');
        var total=0;
        if(sales.orders&&sales.orders.length>0){
            var rows=[];
            sales.orders.forEach(function(o,idx){
                var paid=window.WMS.safeNumber(o.paid_amount||o.final_amount);
                total+=paid;
                rows.push('<tr><td data-label="STT">'+(idx+1)+'</td><td data-label="Mã">'+window.WMS.escapeHtml(o.code||'')+'</td><td data-label="Ngày">'+(window.WMS.formatDateOnly(o.order_date)||'')+'</td><td data-label="NV">'+window.WMS.escapeHtml(o.employee_name||'')+'</td><td data-label="KH">'+window.WMS.escapeHtml(o.customer||o.customer_name||'')+'</td><td data-label="SL" style="text-align:right">'+window.WMS.safeNumber(o.item_count)+'</td><td data-label="Tổng" style="text-align:right">'+window.WMS.formatMoney(o.final_amount)+'</td><td data-label="CK" style="text-align:right">'+window.WMS.formatMoney(o.discount_amount)+'</td><td data-label="Thanh toán" style="text-align:right">'+window.WMS.formatMoney(paid)+'</td></tr>');
            });
            body.innerHTML=rows.join('');
        }else{
            body.innerHTML='<tr><td colspan="9" style="text-align:center;color:#999;">Không có dữ liệu</td></tr>';
        }
        document.getElementById('sales-total').innerText=window.WMS.formatMoney(total);
    }).catch(function(e){
        document.getElementById('sales-loading').style.display='none';
        var err=document.getElementById('sales-error');
        err.style.display='';
        err.innerHTML='<span style="color:#dc2626">Lỗi tải dữ liệu doanh thu: '+e.message+'</span>';
    });
})();
</script>
