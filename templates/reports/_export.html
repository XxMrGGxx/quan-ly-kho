<div class="report-section" id="rpt-export">
    <div id="export-loading" class="text-center" style="padding:20px;color:#94a3b8"><i>Đang tải báo cáo xuất hàng...</i></div>
    <div id="export-error" class="text-center" style="display:none"></div>
    <div id="export-content" style="display:none">
        <table class="report-table">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã đơn</th>
                    <th>Ngày xuất</th>
                    <th>Khách hàng</th>
                    <th>SL SP</th>
                    <th>Tổng tiền</th>
                    <th>Giảm giá</th>
                    <th>Thanh toán</th>
                </tr>
            </thead>
            <tbody id="export-body"></tbody>
            <tfoot>
                <tr>
                    <td colspan="7" style="text-align:right;font-weight:bold;">Tổng cộng:</td>
                    <td id="export-total" style="font-weight:bold;">0 đ</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
<script>
(function(){
    var f = window.reportFilters || {};
    var params = 'start_date='+f.start_date+'&end_date='+f.end_date+(f.warehouse_id?'&warehouse_id='+f.warehouse_id:'');
    window.WMS.api('/reports/export_orders?'+params).then(function(exp){
        document.getElementById('export-loading').style.display='none';
        document.getElementById('export-content').style.display='';
        var body=document.getElementById('export-body');
        if(exp.orders&&exp.orders.length>0){
            var rows=[];
            exp.orders.forEach(function(o,idx){
                rows.push('<tr><td data-label="STT">'+(idx+1)+'</td><td data-label="Mã">'+window.WMS.escapeHtml(o.code||'')+'</td><td data-label="Ngày">'+(window.WMS.formatDateOnly(o.order_date)||'')+'</td><td data-label="KH">'+window.WMS.escapeHtml(o.customer||'')+'</td><td data-label="SL" style="text-align:right">'+window.WMS.safeNumber(o.item_count)+'</td><td data-label="Tổng" style="text-align:right">'+window.WMS.formatMoney(o.final_amount)+'</td><td data-label="CK" style="text-align:right">'+window.WMS.formatMoney(o.discount_amount)+'</td><td data-label="Thanh toán" style="text-align:right">'+window.WMS.formatMoney(o.paid_amount)+'</td></tr>');
            });
            body.innerHTML=rows.join('');
        }else{
            body.innerHTML='<tr><td colspan="8" style="text-align:center;color:#999;">Không có dữ liệu</td></tr>';
        }
        document.getElementById('export-total').innerText=window.WMS.formatMoney(exp.total_amount||0);
    }).catch(function(e){
        document.getElementById('export-loading').style.display='none';
        var err=document.getElementById('export-error');
        err.style.display='';
        err.innerHTML='<span style="color:#dc2626">Lỗi tải dữ liệu xuất hàng: '+e.message+'</span>';
    });
})();
</script>
