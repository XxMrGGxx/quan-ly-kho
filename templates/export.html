{% extends "base.html" %}
{% block page_title %}Xuất kho{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <div class="flex" style="justify-content:space-between;align-items:center;gap:12px;width:100%;">
            <span>Danh sách phiếu xuất kho</span>
            <div class="flex gap-2" style="align-items:flex-end;">
                <div>
                    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px;">Từ ngày</label>
                    <input type="date" id="from_date" class="input" style="min-width:170px;" />
                </div>
                <div>
                    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px;">Đến ngày</label>
                    <input type="date" id="to_date" class="input" style="min-width:170px;" />
                </div>
                <button class="btn btn-success" onclick="exportSelectedToExcel()">Xuất file</button>
                <button class="btn btn-primary" onclick="window.location.href='/export/new'">+ Tạo phiếu xuất</button>
            </div>
        </div>
    </div>
<div class="card-body" style="padding:0;">
         <table class="responsive-table">
             <thead>
                  <tr><th style="width:44px;"><input type="checkbox" id="select_all" onclick="toggleSelectAll(this)" /></th><th data-label="Mã">Mã phiếu</th><th data-label="KH">Khách hàng</th><th data-label="Ngày">Ngày xuất</th><th data-label="NLP">Người lập</th><th data-label="TT">Trạng thái</th><th data-label="Tổng">Tổng tiền</th><th data-label="HĐ">Hành động</th></tr>
             </thead>
             <tbody id="table-body"></tbody>
         </table>
     </div>
</div>

<script src="/static/js/export.js"></script>
{% endblock %}
