<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán công nợ</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/modal.css">
    <link rel="stylesheet" href="/static/css/debt_payment.css">
</head>
<body>
    <div class="main-content" style="margin-left:0">
        <header class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <h2 style="margin:0; font-size:18px; color:#0f172a;">Thanh toán công nợ</h2>
            </div>
            <div class="header-right">
                <a href="/debt" class="btn btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    Quay lại
                </a>
            </div>
        </header>

        <div class="content-area">
            <!-- Chọn đối tác -->
            <div class="card search-card" style="margin-bottom:1rem;">
                <div class="card-header">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Chọn đối tác để thanh toán
                </div>
                <div class="card-body">
                    <div class="search-layout">
                        <div class="partner-search-wrapper">
                            <div class="search-input-group">
                                <span class="search-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                </span>
                                <input type="text" id="partner-search" class="input" placeholder="Gõ mã hoặc tên khách hàng / nhà cung cấp..." autocomplete="off">
                                <button type="button" id="clear-search" class="clear-btn" style="display:none;" onclick="clearSearchInput()">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                </button>
                            </div>
                            <div id="partner-dropdown" class="partner-dropdown" style="display:none;"></div>
                        </div>
                        <div id="partner-filter" class="partner-filter">
                            <button class="filter-btn active" data-type="all" onclick="filterPartnerType('all')">
                                <span class="filter-icon">🏠</span> Tất cả
                            </button>
                            <button class="filter-btn" data-type="customer" onclick="filterPartnerType('customer')">
                                <span class="filter-icon">👤</span> Khách hàng
                            </button>
                            <button class="filter-btn" data-type="supplier" onclick="filterPartnerType('supplier')">
                                <span class="filter-icon">📦</span> Nhà cung cấp
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Thông tin đối tác + đơn hàng -->
            <div id="payment-section" class="card" style="display:none;">
                <div class="card-header">
                    <span id="selected-partner-title">Đối tác</span>
                    <span id="selected-partner-debt" class="debt-badge debt-warning"></span>
                </div>
                <div class="card-body">
                    <div id="partner-info-bar" class="partner-info-bar"></div>

                    <!-- Công cụ thanh toán -->
                    <div class="payment-toolbar">
                        <div class="toolbar-left">
                            <button class="btn btn-outline btn-sm" onclick="markAllOrders()" title="Đánh dấu tất cả phiếu">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                                Chọn tất cả
                            </button>
                            <button class="btn btn-outline btn-sm" onclick="unmarkAllOrders()" title="Bỏ chọn tất cả">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                                Bỏ chọn
                            </button>
                            <button class="btn btn-outline btn-sm" onclick="markByDebtRange()" title="Chọn theo khoảng nợ">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                                Chọn theo nợ
                            </button>
                        </div>
                        <div class="toolbar-right">
                            <div class="quick-pay-group">
                                <span style="font-size:12px; color:#64748b; font-weight:600;">THANH TOÁN NHANH:</span>
                                <button class="btn btn-sm btn-outline" onclick="quickPay('all')">Tất cả</button>
                                <button class="btn btn-sm btn-outline" onclick="quickPay('unpaid')">Chưa TT</button>
                                <button class="btn btn-sm btn-outline" onclick="quickPay('partial')">Một phần</button>
                            </div>
                        </div>
                    </div>

                    <!-- Bảng đơn hàng -->
                    <div class="orders-table-wrapper">
                        <table class="orders-table">
                            <colgroup>
                                <col style="width:40px">
                                <col style="width:auto">
                                <col style="width:100px">
                                <col style="width:120px">
                                <col style="width:120px">
                                <col style="width:120px">
                                <col style="width:100px">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th style="text-align:center;"><input type="checkbox" id="select-all-orders" onchange="toggleSelectAll(this.checked)"></th>
                                    <th>Mã phiếu</th>
                                    <th>Ngày</th>
                                    <th style="text-align:right">Tổng tiền</th>
                                    <th style="text-align:right">Đã thanh toán</th>
                                    <th style="text-align:right">Còn nợ</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody id="orders-body"></tbody>
                        </table>
                    </div>

                    <!-- Tổng kết -->
                    <div class="payment-summary">
                        <div class="summary-row">
                            <span>Đã chọn:</span>
                            <span id="summary-selected-count">0 phiếu</span>
                        </div>
                        <div class="summary-row">
                            <span>Tổng nợ đã chọn:</span>
                            <span id="summary-selected-debt" style="font-weight:700; color:#dc2626;">0 đ</span>
                        </div>
                        <div class="summary-row summary-total">
                            <span>Công nợ hiện tại của đối tác:</span>
                            <span id="summary-total-debt" style="font-weight:700; color:#dc2626;">0 đ</span>
                        </div>
                        <div class="summary-row">
                            <span>Số tiền thanh toán:</span>
                            <input type="number" id="payment-amount" class="input" style="width:150px; text-align:right;" placeholder="Nhập số tiền" step="0.01" min="0.01">
                        </div>
                        <div class="summary-actions">
                            <button class="btn btn-secondary" onclick="clearPayment()">Hủy</button>
                            <button class="btn btn-primary" onclick="submitBatchPayment()">Ghi nhận thanh toán</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal chọn theo khoảng nợ -->
            <div id="debt-range-modal" class="modal-overlay" aria-hidden="true" style="display:none;">
                <div class="modal-content modal-sm">
                    <div class="modal-header">
                        <h3>Chọn phiếu theo khoảng nợ</h3>
                        <button class="modal-close-btn" onclick="closeDebtRangeModal()" type="button" aria-label="Đóng">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="field" style="margin-bottom:12px;">
                            <label>Từ (VND)</label>
                            <input type="number" id="debt-range-from" class="input" placeholder="0" min="0">
                        </div>
                        <div class="field" style="margin-bottom:14px;">
                            <label>Đến (VND)</label>
                            <input type="number" id="debt-range-to" class="input" placeholder="Không giới hạn" min="0">
                        </div>
                        <div class="actions" style="display:flex; gap:10px; justify-content:flex-end;">
                            <button class="btn btn-secondary" onclick="closeDebtRangeModal()">Hủy</button>
                            <button class="btn btn-primary" onclick="applyDebtRange()">Áp dụng</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/base.js"></script>
    <script src="/static/app.js?v=20260725"></script>
    <script src="/static/js/debt_payment.js"></script>
</body>
</html>
